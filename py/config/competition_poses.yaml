# competition_poses.yaml — 竞赛场地目标点配置
#
# 坐标系：map，与 task_field_map.yaml 对齐
# 场地尺寸：6m x 4m，origin [0.0, 6.0, 0.0]
#
# 布局（从 map 俯视）：
#   y=6.0 ┌──────────────────────────────────────┐
#         │  启动区 (start)                       │
#   y~5.0 │  [箱0] [箱1] [箱2] [箱3]   ← 物资箱行1│
#   y~4.4 │  [箱4] [箱5] [箱6] [箱7]   ← 物资箱行2│
#         │                                      │
#   y~2.0 │       智力题显示区                    │
#         │                                      │
#   y~1.0 │ [区0] [区1] [区2] [区3]   ← 归位区   │
#   y=0.0 └──────────────────────────────────────┘
#          x=0  x=1  x=2  x=3  x=4

# 物资箱目标点（导航到箱前 0.5m，朝向箱）
boxes:
  - {id: 0, x: 0.5, y: 4.6, yaw: 0.0}
  - {id: 1, x: 1.1, y: 4.6, yaw: 0.0}
  - {id: 2, x: 1.7, y: 4.6, yaw: 0.0}
  - {id: 3, x: 2.3, y: 4.6, yaw: 0.0}
  - {id: 4, x: 0.5, y: 4.0, yaw: 0.0}
  - {id: 5, x: 1.1, y: 4.0, yaw: 0.0}
  - {id: 6, x: 1.7, y: 4.0, yaw: 0.0}
  - {id: 7, x: 2.3, y: 4.0, yaw: 0.0}

# 归位区目标点（导航到区前 0.5m，朝向区）
zones:
  - {id: 0, x: 0.6, y: 1.5, yaw: 3.14}
  - {id: 1, x: 1.4, y: 1.5, yaw: 3.14}
  - {id: 2, x: 2.2, y: 1.5, yaw: 3.14}
  - {id: 3, x: 3.0, y: 1.5, yaw: 3.14}

# 启动点（机器人初始位置）
start_pose: {x: 2.0, y: 5.5, yaw: 0.0}

# 智力题拍照位（机器人走到此位置拍摄墙上题目）
puzzle_view_pose: {x: 2.0, y: 2.5, yaw: 3.14}

# 到达检测参数
arrival:
  position_threshold: 0.30   # 到达判定距离 (m)
  angle_threshold: 0.40      # 到达判定角度 (rad)
  settle_frames: 5           # 连续满足帧数
