# ═══════════════════════════════════════════════════════════
# 比赛配置 — 赛前修改这里
#   物资箱: 1=食品  2=工具  3=仪器  4=药品
#   field_id: 1 或 2（启动时命令行指定，也可改这里）
# ═══════════════════════════════════════════════════════════

field_id: 1

# 场地布局
# boxes[场地号][排][列] — 排0=外排(靠启动区固定) 排1=内排(靠归位区随机↓)
field_boxes:
  1:
    - [1, 2, 3, 4]   # 外排固定: 食品 工具 仪器 药品
    - [0, 0, 0, 0]   # ← 内排随机，改成现场顺序
  2:
    - [4, 3, 2, 1]   # 外排固定: 药品 仪器 工具 食品
    - [0, 0, 0, 0]   # ← 内排随机，改成现场顺序

# 归位区类型（各区对应的物资类型）
field_zones:
  1: [1, 2, 3, 4]    # 食品 工具 仪器 药品
  2: [4, 3, 2, 1]    # 药品 仪器 工具 食品

# 坐标模板（两个场地物理尺寸相同）
coordinates:
  box_col_x: [0.5, 1.1, 1.7, 2.3]
  box_outer_y: 1.0      # 外排靠启动区
  box_inner_y: 1.5      # 内排靠归位区
  box_yaw: 0.0
  zone_x: [0.6, 1.4, 2.2, 3.0]
  zone_y: 5.0
  zone_yaw: 3.14

# 超时参数
timeouts:
  competition: 180       # 比赛总时长 (秒)
  math: 20               # 智力题识别超时 (秒)
  pick: 5.0              # 抓取等待超时 (秒)
  place: 5.0             # 放置等待超时 (秒)
  nav2_action: 30.0      # Nav2 导航超时 (秒)
  nav2_arrival_pos: 0.25 # 到达位置阈值 (m)
  nav2_arrival_angle: 0.30 # 到达角度阈值 (rad)
  nav2_arrival_frames: 5   # 到达连续帧数

# 机械臂参数
arm:
  offset_x: 0.110        # LiDAR 与臂肩高度差
  offset_z: 0.25         # LiDAR 与臂肩前后偏移
  box_height: 0.25       # 箱子边长 (m)
  workspace_radius_min: 0.02
  workspace_radius_max: 0.62
  stable_threshold_xy: 0.08   # 稳定检测 XY 标准差阈值
  stable_count_required: 3    # 稳定需要连续帧数
  cache_max_size: 10          # 位置缓存上限

# 物资类型名（日志显示）
box_type_names:
  1: "食品"
  2: "工具"
  3: "仪器"
  4: "药品"

# 总箱数
total_boxes: 8
