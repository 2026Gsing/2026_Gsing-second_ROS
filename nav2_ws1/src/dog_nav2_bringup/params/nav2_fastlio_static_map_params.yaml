# nav2_fastlio_static_map_params.yaml
# Nav2 参数配置（静态地图 + FAST-LIO2 定位模式）
#
# 工作模式说明：
#   使用 map_server 加载预存 2D 栅格地图，global_costmap 通过 static_layer
#   引用该地图。定位由 FAST-LIO2 localization 提供（ICP 配准），不使用 AMCL。
#   controller_server 使用 DWB 局部规划器，odom_topic 指向 /localization。
#
# 适用场景：
#   竞赛或实地运行时，地图已预先构建，使用 FAST-LIO2 进行全局定位。

amcl:
  ros__parameters:
    use_sim_time: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_frame: camera_init
    odom_topic: /localization
    transform_tolerance: 2.0
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_frame: camera_init
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /localization
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "simple_goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 30.0

    simple_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.1
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.1
      max_linear_vel: 0.15
      min_linear_vel: 0.05
      desired_angular_vel: 1.0
      max_angular_vel: 1.5
      rotate_to_heading_angular_vel: 1.0
      lookahead_dist: 0.4
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      use_velocity_scaled_lookahead: false
      min_approach_linear_velocity: 0.10
      approach_velocity_scale: 1.0
      use_collision_detection: false
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: false
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_allowed_time_to_collision: 1.0
      use_interpolation: true
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      transform_tolerance: 2.0
behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_frame: camera_init
    transform_tolerance: 2.0
    plugin_lib_names:
      - "spin"
      - "backup"
      - "drive_on_heading"

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 5.0
      robot_radius: 0.15
      footprint_padding: 0.01
      resolution: 0.05
      update_frequency: 3.0
      publish_frequency: 1.0
      plugins: ["static_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: false
        cost_scaling_factor: 5.0
        inflation_radius: 0.20

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 5.0
      robot_radius: 0.15
      footprint_padding: 0.01
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 5.0
      width: 10
      height: 10
      rolling_window: true
      plugins: ["static_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: false
        cost_scaling_factor: 6.0
        inflation_radius: 0.20
